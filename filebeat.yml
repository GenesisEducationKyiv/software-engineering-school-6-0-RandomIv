filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  - add_docker_metadata: ~
  - drop_event:
      when:
        not:
          equals:
            container.name: "github_notifier_app"
  - decode_json_fields:
      fields: ["message"]
      target: "app_log"
      overwrite_keys: true
      add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "github-notifier-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.name: "github-notifier"
setup.template.pattern: "github-notifier-logs-*"