services:
  e2e-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_notifier
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d github_notifier']
      interval: 5s
      timeout: 3s
      retries: 10

  e2e-redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  e2e-mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 5s
      timeout: 3s
      retries: 10

  notifier-app:
    build: .
    environment:
      NODE_ENV: test
      PORT: 3000
      APP_BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:postgres@e2e-postgres:5432/github_notifier
      REDIS_URL: redis://e2e-redis:6379
      SMTP_HOST: e2e-mailhog
      SMTP_PORT: '1025'
      EMAIL_USER: test@example.com
      EMAIL_PASS: test
      API_KEY: test-api-key
      RELEASE_CHECK_CRON: '0 0 1 1 *'
    ports:
      - '3001:3000'
    depends_on:
      e2e-postgres:
        condition: service_healthy
      e2e-redis:
        condition: service_healthy
      e2e-mailhog:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 20