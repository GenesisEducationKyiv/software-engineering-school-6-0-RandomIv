name: Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/github_notifier
      - run: docker compose -f docker-compose.integration.yml up -d --wait
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/github_notifier
      - run: npm run test:integration:run
      - if: always()
        run: docker compose -f docker-compose.integration.yml down -v